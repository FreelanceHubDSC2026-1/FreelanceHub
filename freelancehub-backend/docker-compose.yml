services:
  postgres:
    image: postgres:16
    container_name: FreelanceHub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: FreelanceHub
      POSTGRES_PASSWORD: example_password
      POSTGRES_DB: FreelanceHub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: